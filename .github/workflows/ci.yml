name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (core and app)
        run: ./gradlew --stacktrace :core:test :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew --stacktrace :app:lintDebug
      - name: Build debug APK
        run: ./gradlew --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            core/build/reports/
            app/build/reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: survix-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
