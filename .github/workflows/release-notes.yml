name: Release notes

# Rewrites the title and notes of a published release from docs/releases/<tag>.md.
# The APK attached to the release is left as it is.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag of the release to update, like v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like v1.2.3, got '$VERSION'"
            exit 1
          fi
          file="docs/releases/$VERSION.md"
          if [ ! -f "$file" ]; then
            echo "::error::$file does not exist"
            exit 1
          fi
          gh release edit "$VERSION" --title "Survix $VERSION" --notes-file "$file"
