name: Release

# Push a tag like v0.1.0 to build the Android app and publish a GitHub release with
#   survix-android.apk
# Or run this workflow by hand: with a version (v0.1.0) it creates that tag on the commit
# it built and publishes the release; with no version it only builds the APK.
# Release notes come from docs/releases/<tag>.md when that file exists, otherwise they are
# generated from the commits. To rewrite the notes of a published release, use
# release-notes.yml.
# The file name carries no version, so .../releases/latest/download/survix-android.apk
# always points at the newest one.
#
# Signing: set the repository secrets SURVIX_KEYSTORE_BASE64, SURVIX_KEYSTORE_PASSWORD,
# SURVIX_KEY_ALIAS and SURVIX_KEY_PASSWORD to sign with a release key. Without them the
# APK is signed with a throwaway debug key: it installs, but later versions signed with
# a real key will need the old one uninstalled first.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to create and publish, like v0.1.0. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.SURVIX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SURVIX_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Test and build
        env:
          SURVIX_KEYSTORE_PASSWORD: ${{ secrets.SURVIX_KEYSTORE_PASSWORD }}
          SURVIX_KEY_ALIAS: ${{ secrets.SURVIX_KEY_ALIAS }}
          SURVIX_KEY_PASSWORD: ${{ secrets.SURVIX_KEY_PASSWORD }}
        run: |
          ./gradlew --stacktrace :core:test :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/survix-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: survix-android.apk
          path: dist/survix-android.apk
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: survix-android.apk
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="$VERSION"; fi
          if [ -f "docs/releases/$tag.md" ]; then
            notes=(--notes-file "docs/releases/$tag.md")
          else
            notes=(--generate-notes)
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # The tag was pushed: publish it as it is.
            gh release create "$GITHUB_REF_NAME" dist/survix-android.apk \
              --title "Survix $GITHUB_REF_NAME" \
              "${notes[@]}" \
              --verify-tag
          else
            # Run by hand: create the tag on the commit that was just built.
            if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version must look like v1.2.3, got '$VERSION'"
              exit 1
            fi
            gh release create "$VERSION" dist/survix-android.apk \
              --target "$GITHUB_SHA" \
              --title "Survix $VERSION" \
              "${notes[@]}"
          fi
