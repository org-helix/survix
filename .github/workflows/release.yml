name: Release

# Push a tag like v0.1.0 to build the Android app and publish a GitHub release with
#   survix-android.apk
# The file name carries no version, so .../releases/latest/download/survix-android.apk
# always points at the newest one.
#
# Signing: set the repository secrets SURVIX_KEYSTORE_BASE64, SURVIX_KEYSTORE_PASSWORD,
# SURVIX_KEY_ALIAS and SURVIX_KEY_PASSWORD to sign with a release key. Without them the
# APK is signed with a throwaway debug key: it installs, but later versions signed with
# a real key will need the old one uninstalled first.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.SURVIX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SURVIX_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Test and build
        env:
          SURVIX_KEYSTORE_PASSWORD: ${{ secrets.SURVIX_KEYSTORE_PASSWORD }}
          SURVIX_KEY_ALIAS: ${{ secrets.SURVIX_KEY_ALIAS }}
          SURVIX_KEY_PASSWORD: ${{ secrets.SURVIX_KEY_PASSWORD }}
        run: |
          ./gradlew --stacktrace :core:test :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/survix-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: survix-android.apk
          path: dist/survix-android.apk
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: survix-android.apk
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/survix-android.apk \
            --title "Survix $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
